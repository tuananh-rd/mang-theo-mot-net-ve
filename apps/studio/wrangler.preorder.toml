# C20 public preorder API. Claude must review route/Access policy before deployment.
name = "mang-theo-mot-net-ve-preorder-api"
main = "src/preorder-public-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mangtheomotnetve.website/api/preorders*", zone_name = "mangtheomotnetve.website" }
]

[[d1_databases]]
binding = "DB"
database_name = "studio-d1-prod"
database_id = "5f365054-31fc-4b99-a7cd-69fe2494e8d9"

[vars]
PRODUCTION_SITE_ORIGIN = "https://mangtheomotnetve.website"
PREORDER_TEST_MODE = "false"
PREORDER_MAIL_FROM = ""
PREORDER_NOTIFY_TO = ""
PREORDER_REPLY_TO = ""

[[send_email]]
name = "EMAIL"

# Set RATE_LIMIT_SALT as a Worker secret before deployment; never commit its value.
